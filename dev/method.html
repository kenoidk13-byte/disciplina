<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>method</title>
<link rel="stylesheet" href="../app.css"></head><body>
<div id="app" class="app"></div>
<pre id="out" style="padding:14px;font-size:12px;white-space:pre-wrap;color:#9f9"></pre>
<script src="../data.js"></script><script src="../app.js"></script><script src="../ui.js"></script>
<script>
(function () {
  var log = [];
  function ck(n, c, x) { log.push((c ? 'OK   ' : 'FAIL ') + n + (x !== undefined ? ' :: ' + x : '')); }
  function q(s) { return document.querySelector(s); }
  function qa(s) { return document.querySelectorAll(s); }

  try {
    var DS = window.DS, D = window.D, S = DS.S, UI = DS.UI, MIN = DS.MIN_SESSION;
    if (!S.selected.length) S.selected = D.EXERCISES.map(function (e) { return e.id; });
    S.equipment = ['barbell', 'dumbbell', 'machine', 'cable', 'bodyweight', 'smith', 'kettlebell', 'bands'];
    S.onboarded = true;
    S.buildMode = 'auto';
    S.customDays = [];
    S.history = [];
    S.active = null;

    var MAIN = ['chest', 'back', 'shoulders', 'biceps', 'triceps', 'quads', 'ham', 'glutes', 'calves', 'abs'];
    var DAYS = [2, 3, 4];
    var GOALS = ['mass', 'maintain', 'cut'];
    var names = { 2: ['Всё тело A', 'Всё тело B'], 3: ['Всё тело A', 'Всё тело B', 'Всё тело C'],
      4: ['Верх A', 'Низ A', 'Верх B', 'Низ B'] };

    GOALS.forEach(function (goal) {
      S.goal = goal;
      DAYS.forEach(function (n) {
        S.daysPerWeek = n;
        S.program = null;
        DS.generateProgram();
        var tag = goal + ' ' + n + 'д';
        ck(tag + ': дней', !!S.program && S.program.days.length === n, S.program ? S.program.days.length : 0);
        ck(tag + ': имена сплита', S.program.days.map(function (d) { return d.name; }).join('|') === names[n].join('|'),
          S.program.days.map(function (d) { return d.name; }).join('|'));

        var short = S.program.days.filter(function (d) { return DS.daySeconds(d.items) < MIN; });
        ck(tag + ': все дни >= 50 мин', short.length === 0,
          S.program.days.map(function (d) { return Math.round(DS.daySeconds(d.items) / 60); }).join('/'));
        ck(tag + ': не больше 9 упражнений', S.program.days.every(function (d) { return d.items.length <= 9; }),
          S.program.days.map(function (d) { return d.items.length; }).join('/'));

        var seen = {}, dup = [];
        S.program.days.forEach(function (d) {
          d.items.forEach(function (it) {
            if (seen[it.exId]) dup.push(it.exId);
            seen[it.exId] = true;
          });
        });
        ck(tag + ': без повторов в неделю', dup.length === 0, dup.join(','));

        var freq = DS.weekFrequency(), lowF = MAIN.filter(function (m) { return (freq[m] || 0) < 2; });
        ck(tag + ': частота 2+', lowF.length === 0,
          lowF.map(function (m) { return D.GROUP[m] + '=' + (freq[m] || 0); }).join(',') || 'все 2+');

        var vol = DS.weekVolume(), low = [], high = [];
        MAIN.forEach(function (m) {
          var t = DS.volTarget(m), v = vol[m] || 0;
          if (v < t[0] - 0.01) low.push(D.GROUP[m] + '=' + Math.round(v) + ' (' + t[0] + '–' + t[1] + ')');
          if (v > t[1] + 2.01) high.push(D.GROUP[m] + '=' + Math.round(v) + ' (' + t[0] + '–' + t[1] + ')');
        });
        ck(tag + ': объём не ниже цели', low.length === 0, low.join(', ') || 'все >= нижней');
        ck(tag + ': объём не выше цели +2', high.length === 0, high.join(', ') || 'все <= верхней +2');

        var badRir = [];
        S.program.days.forEach(function (d) {
          d.items.forEach(function (it) {
            if (typeof it.rir !== 'number' || it.rir < 0 || it.rir > 3) badRir.push(it.exId + ':' + it.rir);
          });
        });
        ck(tag + ': RIR задан 0–3', badRir.length === 0, badRir.join(','));
      });
    });

    /* ---- разгрузка ---- */
    S.goal = 'mass'; S.daysPerWeek = 3; S.program = null;
    DS.generateProgram();
    var before = S.program.days.map(function (d) {
      return d.items.map(function (it) { return it.exId + ':' + it.sets; }).join(',');
    }).join('|');
    ck('разгрузка: сначала не нужна', !DS.needsDeload());
    S.program.createdAt = Date.now() - 43 * 86400000;
    ck('разгрузка: через 6 недель нужна', DS.needsDeload());
    DS.startDeload();
    var dl = DS.deloadState();
    ck('разгрузка: активна', !!dl && dl.active);
    ck('разгрузка: подходы срезаны', S.program.days.every(function (d) {
      return d.items.every(function (it) { return it.sets >= 2 && it.sets <= 3; });
    }), S.program.days[0].items.map(function (it) { return it.sets; }).join(','));
    ck('разгрузка: копия сохранена', Array.isArray(S.program.deloadBackup));
    DS.endDeload();
    var after = S.program.days.map(function (d) {
      return d.items.map(function (it) { return it.exId + ':' + it.sets; }).join(',');
    }).join('|');
    ck('разгрузка: объём восстановлен', before === after);
    ck('разгрузка: флаг снят', !DS.deloadState() && !S.program.deloadBackup);

    /* ---- интерфейс ---- */
    DS.go('program');
    ck('панель объёма есть', !!q('.vol'));
    ck('панель объёма: строки', qa('.volrow').length >= 8, qa('.volrow').length);
    ck('панель объёма: сумма', /в норме/.test((q('.vol-sum') || {}).textContent || ''), (q('.vol-sum') || {}).textContent);
    ck('панель объёма: частота', qa('.vol-n i').length >= 8, qa('.vol-n i').length);
    ck('панель объёма: без переполнения', document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1,
      document.documentElement.scrollWidth + '/' + document.documentElement.clientWidth);

    DS.go('settings');
    ck('настройки: методика', qa('.met').length === 4, qa('.met').length);
    ck('настройки: объём описан', /10–20/.test(q('.met').textContent), q('.met').textContent);

    DS.startSession(S.program.days[0]);
    ck('сессия: подсказка RIR', /RIR/.test((q('.sess-hint') || {}).textContent || ''), (q('.sess-hint') || {}).textContent);
  } catch (e) {
    log.push('ERROR ' + (e && e.message || e) + '\n' + (e && e.stack || ''));
  }

  var fails = log.filter(function (l) { return l.indexOf('FAIL') === 0 || l.indexOf('ERROR') === 0; }).length;
  document.title = fails ? 'FAIL ' + fails : 'PASS';
  document.getElementById('out').textContent = 'RESULT ' + document.title + '\n\n' + log.join('\n');
})();
</script>
</body></html>
